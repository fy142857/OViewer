name: Publish verified candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, for example v1.0.1'
        required: true
        type: string
      android_run_id:
        description: 'Verified Android workflow run ID'
        required: true
        type: string
      ios_run_id:
        description: 'Verified iOS workflow run ID'
        required: true
        type: string
      check_only:
        description: 'Validate without creating tags, releases or attachments'
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: oviewer-stable-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install package verification tools
        run: sdkmanager 'build-tools;35.0.0'
      - name: Test release guards
        run: python -m unittest discover -s scripts/tests -v
      - name: Validate and optionally publish original installers
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          ANDROID_RUN_ID: ${{ inputs.android_run_id }}
          IOS_RUN_ID: ${{ inputs.ios_run_id }}
          CHECK_ONLY: ${{ inputs.check_only }}
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          args=()
          if [ "$CHECK_ONLY" = 'false' ]; then args+=(--publish); fi
          python -m scripts.versioning.release --version "$VERSION" \
            --android-run-id "$ANDROID_RUN_ID" --ios-run-id "$IOS_RUN_ID" "${args[@]}"
