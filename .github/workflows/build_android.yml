name: Build Android APK

run-name: "android / ${{ inputs.candidate_id || github.event.pull_request.number }}"

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
  workflow_dispatch:
    inputs:
      candidate_id:
        description: 'Registered candidate, for example 1.0.1+2'
        required: true
        type: string

permissions:
  contents: read
  actions: read


jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_ID: ${{ inputs.candidate_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve registered candidate
        if: github.event_name == 'workflow_dispatch'
        id: candidate
        run: python -m scripts.versioning.build resolve --candidate "$CANDIDATE_ID"

      - name: Checkout exact candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.build_sha }}
          fetch-depth: 0

      - name: Verify candidate source and version
        if: github.event_name == 'workflow_dispatch'
        run: python -m scripts.versioning.build verify --candidate "$CANDIDATE_ID"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK API 35
        uses: android-actions/setup-android@v3
        with:
          # Override v3's default: the legacy 'tools' package is no longer available.
          packages: 'platform-tools'

      - name: Install Android SDK build dependencies
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify version rules
        run: python -m unittest discover -s scripts/tests -v

      - name: Analyze against reviewed baseline
        run: python -m scripts.versioning.analyze

      - name: Flutter tests
        run: flutter test --no-pub --reporter expanded

      - name: Restore permanent signing key
        if: github.event_name == 'workflow_dispatch'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          value = os.environ['ANDROID_KEYSTORE_BASE64']
          if not value:
              raise SystemExit('ANDROID_KEYSTORE_BASE64 is missing')
          path = Path(os.environ['RUNNER_TEMP']) / 'oviewer-release.jks'
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          PY

      - name: Build APK
        if: github.event_name == 'workflow_dispatch'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/oviewer-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Inspect package and write build metadata
        if: github.event_name == 'workflow_dispatch'
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: python -m scripts.versioning.build metadata --candidate "$CANDIDATE_ID" --platform android --file build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          path: build/app/outputs/flutter-apk/app-release.apk
          # Upload the single installer directly instead of wrapping it in a ZIP.
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload build metadata
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: build-metadata
          overwrite: true
          path: build-metadata.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/oviewer-release.jks"
