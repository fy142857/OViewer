name: Build iOS IPA

run-name: "${{ inputs.benchmark_tests && format('benchmark round {0} / ', inputs.benchmark_round) || '' }}ios / ${{ inputs.candidate_id || github.event.pull_request.number }} / slow:${{ github.event_name == 'pull_request' && 'auto' || (inputs.skip_reader_prefetch_tests && 'skip' || 'run') }}"

on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
  workflow_dispatch:
    inputs:
      benchmark_tests:
        description: 'Experimental test-only concurrency comparison'
        default: false
        type: boolean
      benchmark_round:
        description: 'Experiment round'
        default: '1'
        type: choice
        options: ['1', '2', '3']
      candidate_id:
        description: 'Registered candidate, for example 1.0.1+2'
        required: true
        type: string
      skip_reader_prefetch_tests:
        description: '跳过慢测试（阅读器预读组合场景；其他测试仍运行）'
        default: false
        type: boolean
      test_scope:
        description: '自动分发携带的测试判断；手动构建留空'
        default: ''
        type: string

permissions:
  contents: read
  actions: read


jobs:
  build-ios:
    if: ${{ !inputs.benchmark_tests }}
    # macos-14 is retiring. Validate Xcode 16.4 on macos-15 while retaining
    # the project's iOS 12 deployment target; device compatibility needs testing.
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_ID: ${{ inputs.candidate_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve registered candidate
        if: github.event_name == 'workflow_dispatch'
        id: candidate
        run: python -m scripts.versioning.build resolve --candidate "$CANDIDATE_ID"

      - name: Checkout exact candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.build_sha }}
          fetch-depth: 0

      - name: Verify candidate source and version
        if: github.event_name == 'workflow_dispatch'
        run: python -m scripts.versioning.build verify --candidate "$CANDIDATE_ID"

      - name: Resolve test scope
        id: test_scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SKIP_READER_PREFETCH_TESTS: ${{ inputs.skip_reader_prefetch_tests }}
          DISPATCHED_TEST_SCOPE: ${{ inputs.test_scope }}
        run: python -m scripts.versioning.test_policy workflow

      - name: Test Pod deployment target guard
        run: ruby scripts/tests/ios_deployment_target_guard_test.rb

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Verify vendored WebView against official archive
        run: python -m scripts.verify_webview_vendor --download-upstream --check-resolution

      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify version rules
        run: python -m unittest discover -s scripts/tests -v

      - name: Analyze against reviewed baseline
        run: python -m scripts.versioning.analyze

      - name: Flutter tests
        env:
          SKIP_READER_PREFETCH_TESTS: ${{ steps.test_scope.outputs.skip_slow }}
        run: |
          if [[ "$SKIP_READER_PREFETCH_TESTS" == "true" ]]; then
            echo "::notice::Selected scope excludes reader_prefetch_slow; all other Flutter tests remain enabled."
            flutter test --no-pub --reporter expanded --exclude-tags reader_prefetch_slow
          else
            flutter test --no-pub --reporter expanded
          fi

      - name: Build iOS (no codesign)
        if: github.event_name == 'workflow_dispatch'
        run: |
          flutter build ios --release --no-codesign --config-only
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Verify iOS deployment declarations
        if: github.event_name == 'workflow_dispatch'
        run: >-
          python -m scripts.verify_ios_minimum
          --app build/ios/DerivedData/Build/Products/Release-iphoneos/Runner.app
          --report build/ios/ios-compatibility.json

      - name: Upload iOS compatibility report
        if: always() && github.event_name == 'workflow_dispatch' && hashFiles('build/ios/ios-compatibility.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ios-compatibility
          path: build/ios/ios-compatibility.json
          if-no-files-found: error
          retention-days: 30

      - name: Create unsigned IPA
        if: github.event_name == 'workflow_dispatch'
        run: |
          APP_PATH="build/ios/DerivedData/Build/Products/Release-iphoneos/Runner.app"
          mkdir -p build/ios/ipa/Payload
          cp -r "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r OViewer.ipa Payload
          rm -rf Payload

      - name: Inspect package and write build metadata
        if: github.event_name == 'workflow_dispatch'
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: python -m scripts.versioning.build metadata --candidate "$CANDIDATE_ID" --platform ios --file build/ios/ipa/OViewer.ipa

      - name: Upload IPA artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          path: build/ios/ipa/OViewer.ipa
          # Upload the single installer directly instead of wrapping it in a ZIP.
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload build metadata
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: build-metadata
          overwrite: true
          path: build-metadata.json
          if-no-files-found: error
          retention-days: 30

  test-benchmark:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.benchmark_tests }}
    name: benchmark round ${{ inputs.benchmark_round }} / concurrency ${{ matrix.concurrency }}
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        concurrency: [1, 2, 3]
    defaults:
      run:
        working-directory: subject
    steps:
      - name: Checkout experimental harness
        uses: actions/checkout@v4
        with:
          path: benchmark-harness
          sparse-checkout: scripts/benchmark_flutter_tests.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Checkout frozen candidate 139
        uses: actions/checkout@v4
        with:
          ref: dbf940b36996169f0817a3b45480d0f50cc3ec6e
          path: subject
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Pod deployment target guard
        run: ruby scripts/tests/ios_deployment_target_guard_test.rb
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Setup Flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
          cache: true
      - name: Flutter doctor
        run: flutter doctor -v
      - name: Get dependencies
        run: flutter pub get
      - name: Verify vendored WebView against official archive
        run: python -m scripts.verify_webview_vendor --download-upstream --check-resolution
      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Verify version rules
        run: python -m unittest discover -s scripts/tests -v
      - name: Analyze against reviewed baseline
        run: python -m scripts.versioning.analyze
      - name: Measure Flutter tests
        env:
          FLUTTER_CACHE_HIT: ${{ steps.flutter.outputs.CACHE-HIT }}
          PUB_CACHE_HIT: ${{ steps.flutter.outputs.PUB-CACHE-HIT }}
          BENCHMARK_ROUND: ${{ inputs.benchmark_round }}
          TEST_CONCURRENCY: ${{ matrix.concurrency }}
        run: python ../benchmark-harness/scripts/benchmark_flutter_tests.py --round "$BENCHMARK_ROUND" --concurrency "$TEST_CONCURRENCY"
      - name: Upload benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-r${{ inputs.benchmark_round }}-c${{ matrix.concurrency }}
          path: subject/reports/
          if-no-files-found: warn
          retention-days: 30
