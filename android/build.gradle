buildscript {
    ext.kotlin_version = '1.9.24'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    // Kotlin 1.9's relocatable incremental cache cannot relativize plugin
    // sources on another Windows drive against the Android project directory.
    // Set the supported project property before plugin evaluation. Projects
    // on the same root (including Linux/macOS CI) keep incremental compilation.
    if (project.projectDir.canonicalFile.toPath().root !=
            rootProject.projectDir.canonicalFile.toPath().root) {
        project.extensions.extraProperties.set('kotlin.incremental', 'false')
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

// flutter_inappwebview 5.x is pinned by the app; its older Android module
// Android module predates AGP 8's mandatory namespace declaration. Apply the
// package name declared by the plugin's AndroidManifest without modifying the
// Pub cache, so this compatibility fix is reproducible in CI and locally.
subprojects { subproject ->
    if (subproject.name == 'flutter_inappwebview') {
        subproject.plugins.withId('com.android.library') {
            def androidExtension = subproject.extensions.findByName('android')
            if (androidExtension != null && !androidExtension.namespace) {
                androidExtension.namespace =
                    'com.pichillilorenzo.flutter_inappwebview'
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
