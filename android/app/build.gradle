def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

def environmentSigning = [
    storeFile: System.getenv('ANDROID_KEYSTORE_PATH'),
    storePassword: System.getenv('ANDROID_KEYSTORE_PASSWORD'),
    keyAlias: System.getenv('ANDROID_KEY_ALIAS'),
    keyPassword: System.getenv('ANDROID_KEY_PASSWORD')
]
// CI uses only environment secrets. Local builds may use android/key.properties
// when no signing environment variables are set; never mix the two sources.
def useEnvironmentSigning = System.getenv('GITHUB_ACTIONS') == 'true' ||
    System.getenv('CI') == 'true' || environmentSigning.values().any { it != null }
def localSigning = new Properties()
def localSigningFile = rootProject.file('key.properties')
if (!useEnvironmentSigning && localSigningFile.isFile()) {
    localSigningFile.withReader('UTF-8') { reader -> localSigning.load(reader) }
}
def releaseSigning = useEnvironmentSigning ? environmentSigning : [
    storeFile: localSigning.getProperty('storeFile'),
    storePassword: localSigning.getProperty('storePassword'),
    keyAlias: localSigning.getProperty('keyAlias'),
    keyPassword: localSigning.getProperty('keyPassword')
]
def hasReleaseSigning = releaseSigning.values().every { it != null && !it.isEmpty() }

android {
    testOptions { unitTests.includeAndroidResources = true }
    namespace "com.oviewer.oviewer"
    compileSdkVersion 35
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.oviewer.oviewer"
        minSdkVersion 21
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

// Validation and debug builds need no release secrets. Every actual release
// build must fail before packaging if its permanent signing configuration is absent.
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') {
        task.doFirst {
            if (!hasReleaseSigning || !rootProject.file(releaseSigning.storeFile).isFile()) {
                throw new GradleException('Release signing requires all four ANDROID_KEYSTORE_PATH / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD environment variables, or (local builds only, with no signing environment variables set) android/key.properties containing storeFile / storePassword / keyAlias / keyPassword. Debug signing is never used for release builds.')
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
